<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: url('https://cdn.motor1.com/images/mgl/wl6wOV/s3/bmw-s-1000-rr-2025-comeca-a-ser-fabricada-no-brasil.webp') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            text-align: center; 
            padding: 50px 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* Caixa escura semi-transparente para dar leitura ao texto sobre a foto */
        .content {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
        }
        h1 { font-size: 24px; margin: 0 0 10px 0; }
        p { font-size: 16px; color: #ccc; margin: 0; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="content">
        <h1>Ruan</h1>
        <p>Outra Hora Faço</p>
    </div>

</body>
</html>
